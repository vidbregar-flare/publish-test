name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for provenance
    steps:
      - uses: actions/checkout@v4

      - uses: flare-foundation/npm-release-action@add-action
        with:
          npm_access: public
          dry_run: false
